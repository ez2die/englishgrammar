<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grammar Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* --- Star Map design tokens (night-sky brand language) --- */
      :root {
        --sky-0: #0a0a24;      /* deepest night */
        --sky-1: #141149;      /* indigo */
        --sky-2: #241a56;      /* purple-indigo */
        --sky-glow: #3a2a7a;
        --gold: #f5c453;       /* amber accent */
        --gold-soft: #ffe6a1;
        --rar-common: #eef2ff;
        --rar-rare: #7cc4ff;
        --rar-epic: #c39bff;
        --rar-legend: #ffcf5c;
      }
      /* Distinctive display font (headings/brand); Nunito stays for body */
      .font-display { font-family: 'Fredoka', 'Nunito', sans-serif; }

      @keyframes twinkle { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes shootStar {
        0% { transform: translate(-10vw, -10vh) rotate(35deg); opacity: 0; }
        10% { opacity: 1; }
        70% { opacity: 1; }
        100% { transform: translate(60vw, 55vh) rotate(35deg); opacity: 0; }
      }
      .animate-twinkle { animation: twinkle 3s ease-in-out infinite; }
      .animate-floatY { animation: floatY 4s ease-in-out infinite; }
      /* Orchestrated entrance: start hidden, reveal with per-element animation-delay */
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
      .reveal { opacity: 0; animation: rise .55s cubic-bezier(.2,.7,.2,1) forwards; }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(139, 92, 246, 0.3);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(139, 92, 246, 0.5);
      }
      
      body {
        font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior: none;
      }
      
      /* Animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out;
      }
      
      @keyframes scaleUp {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      
      .animate-scale-up {
        animation: scaleUp 0.2s ease-out;
      }
      
      /* Mobile optimizations */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Prevent text selection on buttons */
      button {
        -webkit-user-select: none;
        user-select: none;
      }
      
      /* Smooth transitions */
      * {
        transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      /* Safe area insets for mobile devices */
      .safe-area-inset {
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      
      .safe-area-top {
        padding-top: env(safe-area-inset-top);
      }
      
      .safe-area-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }
      
      /* Touch manipulation for better mobile performance */
      .touch-manipulation {
        touch-action: manipulation;
      }
      
      /* Better text rendering on mobile */
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
